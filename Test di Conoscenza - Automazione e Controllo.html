<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test di Elettronica e PLC</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .question {
            margin: 15px 0;
            padding: 10px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .options {
            margin-top: 10px;
        }
        .options label {
            display: block;
            margin: 5px 0;
        }
        button {
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <h1>Test di Elettronica e PLC</h1>
    
    <form id="quizForm">
        <div class="question">
            <p>1. Qual è la legge di Ohm?</p>
            <div class="options">
                <label><input type="radio" name="q1" value="A"> A) V = I · R</label>
                <label><input type="radio" name="q1" value="B"> B) P = V · I</label>
                <label><input type="radio" name="q1" value="C"> C) R = V/I</label>
                <label><input type="radio" name="q1" value="D"> D) Tutte le precedenti</label>
            </div>
        </div>
        
        <div class="question">
            <p>2. Quale componente elettronico è utilizzato per limitare la corrente in un circuito?</p>
            <div class="options">
                <label><input type="radio" name="q2" value="A"> A) Resistenza</label>
                <label><input type="radio" name="q2" value="B"> B) Condensatore</label>
                <label><input type="radio" name="q2" value="C"> C) Induttore</label>
                <label><input type="radio" name="q2" value="D"> D) Diodo</label>
            </div>
        </div>

        <!-- Aggiungi qui il resto delle domande in modo simile -->

        <div class="question">
            <p>20. Qual è la funzione principale di un PLC?</p>
            <div class="options">
                <label><input type="radio" name="q20" value="A"> A) Eseguire calcoli complessi</label>
                <label><input type="radio" name="q20" value="B"> B) Controllare processi industriali</label>
                <label><input type="radio" name="q20" value="C"> C) Memorizzare dati</label>
                <label><input type="radio" name="q20" value="D"> D) Amplificare segnali</label>
            </div>
        </div>

        <button type="submit">Invia Risposte</button>
    </form>

    <script>
        document.getElementById('quizForm').addEventListener('submit', function(event) {
            event.preventDefault();
            alert('Le tue risposte sono state inviate! (Funzionalità non implementata)');
        });
    </script>
</body>
</html>
